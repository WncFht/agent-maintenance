default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^assets/\.crossnote/
repos:
  - repo: local
    hooks:
      - id: markdownlint
        name: Markdown lint
        entry: node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
        exclude: ^\.agents/notes/archived/
      - id: prose-format
        stages: [manual]
        name: Format staged Markdown
        entry: node_modules/.bin/git-format-staged --formatter "bash scripts/fmt-markdown.sh {}"
        language: system
        types: [markdown]
        exclude: ^\.agents/notes/archived/
      - id: config-format
        stages: [manual]
        name: Format staged configuration
        entry: node_modules/.bin/git-format-staged --formatter "node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        files: '\.(yaml|yml|json|jsonc)$|^\.prettierrc$'
      - id: python-format
        stages: [manual]
        name: Format staged Python
        entry: node_modules/.bin/git-format-staged --formatter "ruff format --stdin-filename {} -"
        language: system
        types: [python]
      - id: python-lint
        name: Python lint
        entry: ruff check
        language: system
        types: [python]
      - id: spacing
        name: AutoCorrect prose and code (check only)
        entry: python3 scripts/check_spacing.py
        language: system
        pass_filenames: false
        always_run: true
      - id: toml-format
        name: Format staged TOML
        entry: node_modules/.bin/git-format-staged --formatter "taplo fmt --stdin-filepath {} -"
        language: system
        types: [toml]
        stages: [manual]
      - id: shell-format
        name: Format staged shell
        entry: node_modules/.bin/git-format-staged --formatter "bash scripts/fmt-shell.sh"
        language: system
        types: [shell]
        stages: [manual]
      - id: shell-lint
        name: Shell syntax and static rules
        entry: python3 scripts/check_shell.py
        language: system
        types: [shell]
      - id: actions
        name: GitHub Actions validation
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
      - id: yaml-comments
        name: YAML comment width
        entry: python3 scripts/check-yaml-comments.py
        language: system
        types: [yaml]
      - id: staged-contracts
        name: Staged document and note contracts
        entry: python3 scripts/staged_checks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: secrets
        name: Staged secrets
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: maintenance
        name: Maintenance checks before push
        entry: python3 scripts/run_checks.py --config scripts/checks.json --mode ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
